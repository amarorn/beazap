services:
  postgres:
    image: postgres:16-alpine
    container_name: beazap-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution123
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    networks:
      beazap-net:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: beazap-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - beazap-net

  redpanda:
    image: redpandadata/redpanda:v24.2.2
    container_name: beazap-redpanda
    command: redpanda start
    ports:
      - "9092:9092"
    networks:
      - beazap-net

  wppconnect:
    image: wppconnect/server-cli:latest
    platform: linux/amd64
    container_name: beazap-wppconnect
    ports:
      - "21465:21465"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SECRET_KEY: "${WPPCONNECT_SECRET:-THISISMYSECURETOKEN}"
      # Ultimo segmento da URL deve ser igual ao Instance.instance_name (ex.: teste -> /webhook/teste).
      WEBHOOK_GLOBAL_URL: "${WPPCONNECT_WEBHOOK_URL:-http://host.docker.internal:8000/webhook/default}"
      WEBHOOK_GLOBAL_ENABLED: "true"
    volumes:
      - wppconnect_data:/sessions
    networks:
      - beazap-net
    restart: unless-stopped

  init-kafka:
    image: redpandadata/redpanda:v24.2.2
    container_name: beazap-init-kafka
    command: rpk topic create wa.raw-events wa.normalized-events message.outbound.requested message.outbound.sent message.outbound.failed -X brokers=redpanda:9092
    depends_on:
      - redpanda
    networks:
      - beazap-net
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  wppconnect_data:

networks:
  beazap-net:
    driver: bridge
